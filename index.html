<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peter Newell | Game Programmer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    
    <style>
        /* CSS to support the layout shift without altering the main stylesheet */
        .profile-section-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
        }

        .profile-text-side {
            text-align: right;
            flex: 1;
        }

        /* Force right alignment for text on the left side */
        .profile-text-side .hero-title,
        .profile-text-side .hero-subtitle {
            text-align: right !important;
        }

        /* Adjust social links alignment to match the right-justified text */
        .profile-text-side .social-links {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 15px;
        }

        /* Enforce social icon sizing to fill the box without swelling the box itself */
        .profile-text-side .social-links .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 75px;   
            height: 45px;  
            padding: 0;    
            box-sizing: border-box;
        }

        .profile-text-side .social-links .btn i {
            font-size: 1.8rem;
            line-height: 1;
        }

        .profile-image-side {
            flex: 1;
            display: flex;
            justify-content: flex-start;
        }

        /* Fluid box container for the image */
        .custom-image-box {
            width: 100%;
            max-width: 400px;
            height: 480px;
            border: 4px solid #00f0ff;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            color: #00f0ff;
            font-size: 1.1rem;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Properly handles the inner image proportions */
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Mobile fallback to switch columns back to stacked view */
        @media (max-width: 768px) {
            .profile-section-wrapper {
                flex-direction: column;
                gap: 30px;
                padding: 0 15px;
            }
            .profile-text-side {
                text-align: center;
                width: 100%;
                /* Explicitly places the text content second in the stack */
                order: 2; 
            }
            .profile-text-side .hero-title,
            .profile-text-side .hero-subtitle {
                text-align: center !important;
            }
            .profile-text-side .social-links {
                justify-content: center;
            }
            .profile-image-side {
                justify-content: center;
                width: 100%;
                /* Explicitly places the image container first in the stack */
                order: 1; 
            }
            .custom-image-box {
                max-width: 340px;
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">PETER NEWELL</a>
            <div class="nav-links">
                <a href="index.html" class="nav-item active">HOME</a>
                <a href="tgp.html" class="nav-item">TEAM PROJECTS</a>
                <a href="personal.html" class="nav-item">PERSONAL</a>
                <a href="about.html" class="nav-item">ABOUT ME</a>
            </div>
        </div>
    </nav>

    <div class="hero-container">

        <div class="hero-bg-overlay"></div>
        

        <main class="hero-content centered-column">
    
            <div class="profile-section-wrapper">
                
                <div class="profile-text-side">
                    <h1 class="hero-title">PETER NEWELL</h1>
                    <p class="hero-subtitle">Game Programmer and Software Developer from Texas</p>
                    
                    <div class="social-links">
                        <a href="https://github.com/peternewell01" target="_blank" rel="noopener noreferrer" class="btn btn-cyan" aria-label="GitHub">
                            <i class="fa-brands fa-github"></i>
                        </a>
                        <a href="https://www.linkedin.com/in/peter-newell-42484a204" target="_blank" rel="noopener noreferrer" class="btn btn-cyan" aria-label="LinkedIn">
                            <i class="fa-brands fa-linkedin"></i>
                        </a>
                    </div>
                </div>

                <div class="profile-image-side">
                    <div class="custom-image-box">
                        <img src="NiceCandid.png" class="profile-img" alt="Peter Newell Portfolio Picture"/>
                    </div>
                </div>

            </div>

            <hr class="arcade-divider">

            <section class="menu-navigation">
                <h2 class="menu-title">SELECT MODE</h2>
                <div class="menu-buttons">
                    <a href="tgp.html" class="btn btn-red btn-large">TEAM PROJECTS</a>
                    <a href="personal.html" class="btn btn-cyan btn-large">PERSONAL</a>
                    <a href="about.html" class="btn btn-green btn-large">ABOUT ME</a>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
